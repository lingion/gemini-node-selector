name: Deploy Gemini Node Selector Edge

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-gns-container.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-gns-container
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: node --test

      - name: Fetch and verify Linux mihomo
        working-directory: server
        run: ./tools/fetch-mihomo-linux.sh

      - name: Generate probed edge artifacts
        working-directory: server
        env:
          GNS_TOKEN: ${{ secrets.GNS_TOKEN }}
          GNS_ADMIN_TOKEN: ${{ secrets.GNS_ADMIN_TOKEN }}
          GNS_SOURCES_JSON: ${{ secrets.GNS_SOURCES_JSON }}
          GNS_AI_STUDIO_API_KEY: ${{ secrets.GNS_AI_STUDIO_API_KEY }}
          GNS_ANTIGRAVITY_TOKEN: ${{ secrets.GNS_ANTIGRAVITY_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p bin
          curl -fL --connect-timeout 20 --max-time 180 \
            -o bin/mihomo-linux-amd64-v1-v1.19.34.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-v1-v1.19.34.gz
          echo '0c07340a01408d033dda4088ea2a4c1e4d82aeed7b2f84f7c046e93b6ff3290c  bin/mihomo-linux-amd64-v1-v1.19.34.gz' | sha256sum -c -
          gzip -dc bin/mihomo-linux-amd64-v1-v1.19.34.gz > bin/mihomo
          chmod +x bin/mihomo
          MIHOMO_BIN="$GITHUB_WORKSPACE/server/bin/mihomo" node scripts/generate-once.mjs

      - name: Deploy edge Worker
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Configure runtime secrets
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GNS_TOKEN: ${{ secrets.GNS_TOKEN }}
          GNS_ADMIN_TOKEN: ${{ secrets.GNS_ADMIN_TOKEN }}
          GNS_SOURCES_JSON: ${{ secrets.GNS_SOURCES_JSON }}
          GNS_AI_STUDIO_API_KEY: ${{ secrets.GNS_AI_STUDIO_API_KEY }}
          GNS_ANTIGRAVITY_TOKEN: ${{ secrets.GNS_ANTIGRAVITY_TOKEN }}
        run: |
          set -euo pipefail
          put_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@latest secret put "$name"
            fi
          }
          put_secret GNS_TOKEN "$GNS_TOKEN"
          put_secret GNS_ADMIN_TOKEN "$GNS_ADMIN_TOKEN"
          put_secret GNS_SOURCES_JSON "$GNS_SOURCES_JSON"
          put_secret GNS_AI_STUDIO_API_KEY "$GNS_AI_STUDIO_API_KEY"
          put_secret GNS_ANTIGRAVITY_TOKEN "$GNS_ANTIGRAVITY_TOKEN"
